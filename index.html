<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Музыка</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7c4dff">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f4f0ff;--card:#fff;--tx:#241b3d;--hint:#8b80b0;--acc:#7c4dff;--soft:#e9e1ff;--sh:0 4px 18px rgba(92,60,200,.14);--hd:#e3d8ff;--fg:#d6c6ff;--inp:#fff}
:root[data-theme=dark]{--bg:#14111f;--card:#1e1a33;--tx:#f1ecff;--hint:#9a8fc0;--acc:#9d7bff;--soft:#2b2547;--sh:0 4px 18px rgba(0,0,0,.45);--hd:#201a38;--fg:#2d2350;--inp:#1e1a33;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ic{width:24px;height:24px;fill:currentColor}
#app{display:flex;flex-direction:column;height:100%}
header{padding:max(14px,env(safe-area-inset-top)) 14px 12px;background:linear-gradient(var(--hd),var(--bg))}
#q{width:100%;padding:11px 16px;border-radius:14px;border:0;background:var(--inp);color:var(--tx);font:inherit;outline:none;box-shadow:var(--sh)}
#q:focus-visible{box-shadow:0 0 0 2px var(--acc)}
main{flex:1;overflow-y:auto;padding:6px 12px 120px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;margin-bottom:4px;cursor:pointer}
.row:active,.row.cur{background:var(--soft)}
.cv{width:52px;height:52px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none}
.tx{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--hint);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur .t{color:var(--acc)}
.ib{width:40px;height:40px;display:grid;place-items:center;flex:none;color:var(--hint)}
.ib svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on svg{fill:#ef4466;stroke:#ef4466}
.msg{color:var(--hint);text-align:center;padding:40px 20px}
.credit{color:var(--hint);font-size:12px;text-align:center;padding:12px}
.cb{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--tx)}
.cb.main{background:var(--acc);color:#fff}
.cb.big{width:68px;height:68px;box-shadow:0 8px 22px rgba(124,77,255,.45)}
.cb.big .ic{width:34px;height:34px}
.cb.on{color:var(--acc);background:var(--soft)}
#mini{display:none;position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:var(--card);border-radius:20px;box-shadow:0 6px 28px rgba(92,60,200,.3);padding:8px 10px 10px;cursor:pointer}
#mini.show{display:block}
.mrow{display:flex;align-items:center;gap:10px}
.mrow img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--soft)}
#full{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));background:linear-gradient(var(--fg),var(--bg) 65%);transform:translateY(100%);visibility:hidden;transition:transform .3s,visibility 0s .3s}
#full.open{transform:none;visibility:visible;transition:transform .3s}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--hint);font-weight:600}
#fc{width:min(78vw,340px);aspect-ratio:1;border-radius:28px;object-fit:cover;background:var(--soft);box-shadow:0 18px 40px rgba(92,60,200,.35);margin:auto 0 24px}
.info{width:100%;display:flex;align-items:center;gap:8px}
#ft{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fa{color:var(--hint)}
#seek{width:100%;margin:14px 0 0;accent-color:var(--acc)}
.time{width:100%;display:flex;justify-content:space-between;color:var(--hint);font-size:13px}
.ctl{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:340px;margin:14px 0 auto}
#dlg,#pld{display:none;position:fixed;inset:0;z-index:9;background:rgba(36,27,61,.45);align-items:center;justify-content:center;padding:20px}
#dlg.show,#pld.show{display:flex}
.box{background:var(--card);border-radius:22px;padding:18px;width:100%;max-width:360px}
.box h2{margin:0 0 12px;font-size:18px}
.box input{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--soft);font:inherit;margin-bottom:8px;outline:none;color:var(--tx);background:var(--inp)}
.box input:focus{border-color:var(--acc)}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{padding:10px 16px;border-radius:12px;font-weight:600;background:var(--soft)}
.btn.p{background:var(--acc);color:#fff}
.hbar{display:flex;align-items:center;gap:6px;margin-bottom:14px}
#title{font-size:22px;font-weight:800;color:var(--acc)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(82vw,320px);background:var(--card);z-index:21;transform:translateX(-104%);transition:transform .28s;overflow-y:auto;border-radius:0 24px 24px 0;box-shadow:var(--sh)}
#drawer.open{transform:none}
.dh{padding:max(24px,env(safe-area-inset-top)) 20px 18px;background:linear-gradient(135deg,var(--acc),#b9a2ff);color:#fff;margin-bottom:10px}
#av{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center;font-size:26px;font-weight:700;overflow:hidden;margin-bottom:12px}
#av img{width:100%;height:100%;object-fit:cover}
.dn{font-size:19px;font-weight:700}
.du{opacity:.85;font-size:14px;min-height:20px}
.di{display:flex;align-items:center;gap:20px;padding:13px 18px;margin:2px 10px;border-radius:26px;font-size:16px;text-align:left;width:calc(100% - 20px)}
.di .ic{color:var(--hint)}
.di.on{background:var(--soft);color:var(--acc);font-weight:600}
.di.on .ic{color:var(--acc)}
.sep{height:1px;background:var(--soft);margin:8px 22px}
.set{padding:4px 6px}
.sh{font-weight:700;margin:18px 0 8px;color:var(--acc)}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:14px;padding:3px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--hint)}
.seg button.on{background:var(--acc);color:#fff}
.hint{color:var(--hint);margin:0}
#mseek{width:100%;margin:6px 0 0;height:20px;accent-color:var(--acc);display:block}
.mrow .cb{width:38px;height:38px}
.ib svg.f{fill:currentColor;stroke:none}
.pbtns{display:flex;gap:10px;margin:4px 0 12px}
.pbtns button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:16px;font-weight:700;background:var(--soft);color:var(--acc)}
.pbtns button.p{background:var(--acc);color:#fff;box-shadow:var(--sh)}
.plhead{display:flex;align-items:center;gap:12px;padding:2px 0 14px}
.plhead .cv{width:92px;height:92px;border-radius:18px}
.plhead .nm{font-size:20px;font-weight:800;overflow-wrap:anywhere}
.row.add .cv{display:grid;place-items:center;color:var(--acc);background:var(--soft)}
.row.add .cv svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
#sov{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);align-items:flex-end}
#sov.show{display:flex}
#spanel{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:14px 10px max(16px,env(safe-area-inset-bottom));max-height:75vh;overflow-y:auto}
#spanel h3{margin:4px 12px 10px;font-size:15px;color:var(--hint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spanel button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:14px;text-align:left;font-size:16px}
#spanel button:active{background:var(--soft)}
#spanel button.dg{color:#ef4466}
#spanel img{width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--soft)}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s;font-size:14px;max-width:86vw;text-align:center}
#toast.show{opacity:1}
.pcov{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pcov img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--soft)}
.btn.dg{color:#ef4466;margin-right:auto}
#login{display:none;position:fixed;inset:0;z-index:60;background:linear-gradient(var(--fg),var(--bg));flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#login.show{display:flex}
#login img{width:104px;height:104px;border-radius:26px;box-shadow:var(--sh);margin-bottom:22px}
#login h2{margin:0 0 8px;font-size:26px;color:var(--acc)}
#login p{color:var(--hint);margin:0 0 22px;max-width:300px}
#lbtn{background:var(--acc);color:#fff;font-weight:700;padding:14px 28px;border-radius:18px;box-shadow:var(--sh)}
#llink{display:none;margin-top:16px;color:var(--acc);font-weight:600}
#lstatus{margin-top:16px;color:var(--hint);font-size:14px;min-height:20px;max-width:300px}
html,body,main{overscroll-behavior-y:contain}
#qhint{display:none;color:var(--hint);font-size:13px;padding:8px 6px 0}
#qhint.show{display:block}
#ptr{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--acc);z-index:25;opacity:0;pointer-events:none;transform:translate(-50%,-50px)}
#ptr svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
#ptr.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hbar">
      <button class="cb" id="menu" aria-label="Меню"><svg class="ic" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <div id="title">Моя музыка</div>
    </div>
    <input id="q" type="search" placeholder="Поиск по библиотеке" autocomplete="off">
    <div id="qhint">Показаны популярные песни. Начните вводить запрос, чтобы искать.</div>
  </header>
  <main id="list"></main>
</div>

<div id="scrim"></div>
<nav id="drawer">
  <div class="dh"><div id="av"></div><div class="dn" id="dname"></div><div class="du" id="duser"></div></div>
  <button class="di on" data-go="lib"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>Моя музыка</button>
  <button class="di" data-go="playlists"><svg class="ic" viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>Плейлисты</button>
  <button class="di" data-go="search"><svg class="ic" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Поиск</button>
  <div class="sep"></div>
  <button class="di" data-go="settings"><svg class="ic" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>Настройки</button>
</nav>

<div id="mini">
  <div class="mrow">
    <img id="mc" alt="">
    <div class="tx"><div class="t" id="mt"></div><div class="s" id="ma"></div></div>
    <button class="cb" id="mprev" aria-label="Предыдущий"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="cb main" id="pp" aria-label="Играть"><svg class="ic" viewBox="0 0 24 24" id="ppi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="cb" id="mnext" aria-label="Следующий"><svg class="ic" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button>
  </div>
  <input id="mseek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Перемотка">
</div>

<section id="full">
  <div class="top">
    <button class="cb" id="close" aria-label="Свернуть"><svg class="ic" viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
    <span>Сейчас играет</span>
    <span style="width:42px"></span>
  </div>
  <img id="fc" alt="">
  <div class="info">
    <div class="tx"><div id="ft"></div><div id="fa"></div></div>
    <button class="cb" id="edit" aria-label="Изменить"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
  </div>
  <input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Перемотка">
  <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="cb" id="sh" aria-label="Перемешать"><svg class="ic" viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
    <button class="cb" id="prev" aria-label="Предыдущий"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="cb main big" id="fpp" aria-label="Играть"><svg class="ic" viewBox="0 0 24 24" id="fppi"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="cb" id="next" aria-label="Следующий"><svg class="ic" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button>
    <button class="cb" id="rp" aria-label="Повтор"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg></button>
  </div>
</section>

<div id="login">
  <img src="icon-192.png" alt="">
  <h2>Музыка</h2>
  <p>Войдите через Telegram, чтобы открыть вашу библиотеку и плейлисты.</p>
  <button id="lbtn">Войти через Telegram</button>
  <a id="llink" target="_blank" rel="noopener">Не открылось? Нажмите сюда</a>
  <button class="btn" id="lcheck" style="display:none;margin-top:14px">Я подтвердил(а) вход</button>
  <div id="lstatus"></div>
</div>

<div id="pld">
  <div class="box">
    <h2 id="pldt">Новый плейлист</h2>
    <input id="pn" placeholder="Название" maxlength="60">
    <div class="pcov"><img id="pci" alt=""><button class="btn" id="pcb">Выбрать обложку</button></div>
    <input id="pf" type="file" accept="image/*" hidden>
    <div class="btns"><button class="btn dg" id="pdel">Удалить</button><button class="btn" id="pcancel">Отмена</button><button class="btn p" id="psave">Сохранить</button></div>
  </div>
</div>

<div id="sov"><div id="spanel"></div></div>
<div id="toast"></div>
<div id="ptr"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5"/></svg></div>

<div id="dlg">
  <div class="box">
    <h2>Изменить трек</h2>
    <input id="et" placeholder="Название" maxlength="100">
    <input id="ea" placeholder="Исполнитель" maxlength="100">
    <div class="btns"><button class="btn" id="ecancel">Отмена</button><button class="btn p" id="esave">Сохранить</button></div>
  </div>
</div>

<script>
const CLIENT_ID = 'a90ebb1e';
const API = 'https://music-api.ivankashiro75.workers.dev';
const tg = window.Telegram && Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} try { tg.disableVerticalSwipes(); } catch (e) {} }
let theme = 'light';
function applyTheme(v) {
  theme = v === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  if (tg) { try { tg.setHeaderColor(theme === 'dark' ? '#201a38' : '#e3d8ff'); tg.setBackgroundColor(theme === 'dark' ? '#14111f' : '#f4f0ff'); } catch (e) {} }
}
try { applyTheme(localStorage.getItem('theme') || 'light'); } catch (e) { applyTheme('light'); }

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.floor(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const UNK = 'Неизвестный исполнитель';
const NOCOVER = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" fill="#8b80b0" fill-opacity=".25"/><path d="M20 15v14.2a4 4 0 1 0 2 3.5V19h8v-4z" fill="#a78bfa"/></svg>');
const heartSvg = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.5 5c2 0 3.6 1.1 5.5 3 1.9-1.9 3.5-3 5.5-3 3.5 0 5.3 3.6 4 6.8C19.5 16.4 12 21 12 21z"/></svg>';
const trashSvg = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

/* Хранилище: облако Telegram, иначе память браузера */
const cloud = (tg && tg.initData && tg.CloudStorage) ? tg.CloudStorage : null;
function sGet(k) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    if (cloud) { try { cloud.getItem(k, (e, v) => fin(e ? null : (v || null))); setTimeout(() => fin(null), 4000); return; } catch (e) {} }
    try { fin(localStorage.getItem(k)); } catch (e) { fin(null); }
  });
}
function sSet(k, v) {
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    if (cloud) { try { cloud.setItem(k, v, fin); setTimeout(fin, 4000); return; } catch (e) {} }
    try { localStorage.setItem(k, v); } catch (e) {}
    fin();
  });
}
function sDel(k) {
  return new Promise(res => {
    if (cloud) { try { cloud.removeItem(k, () => res()); setTimeout(res, 4000); return; } catch (e) {} }
    try { localStorage.removeItem(k); } catch (e) {}
    res();
  });
}

/* Состояние */
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

/* Песни из поиска сохраняются в «Моей музыке» */
const inLib = t => lib.some(x => x.ext && x.rid === 'jm' + t.id);
async function toggleExt(t) {
  if (!t) return;
  if (!D) { toast('Войдите, чтобы сохранять песни'); return; }
  const rid = 'jm' + t.id;
  if (inLib(t)) {
    if (!(await ask('Убрать «' + t.name + '» из «Моей музыки»?'))) return;
    lib = lib.filter(x => x.rid !== rid); render();
    try { await fetch(API + '/api/delete?id=' + encodeURIComponent(rid) + '&d=' + D, { method: 'POST' }); } catch (e) {}
    return;
  }
  lib.unshift({ id: 'L' + rid, rid, name: t.name, artist: t.artist || UNK, image: t.image || '', audio: t.audio, dur: t.dur, lib: true, ext: true });
  render();
  toast('Добавлено в «Мою музыку»');
  const body = JSON.stringify({ id: t.id, name: t.name, artist: t.artist, image: t.image, audio: t.audio, dur: t.dur });
  try { await apiPost('/api/ext/add', body, ''); } catch (e) { toast('Не удалось сохранить'); }
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {} }
}
async function migrateFavs() {
  if (lsGet('favmig') || !D) return;
  lsSet('favmig', '1');
  const ids = (await sGet('favs') || '').split(',').filter(Boolean);
  for (const id of ids) {
    let t = null;
    try { t = JSON.parse(await sGet('t' + id)); } catch (e) {}
    if (!t || !t.audio) continue;
    const body = JSON.stringify({ id: t.id, name: t.name, artist: t.artist, image: t.image, audio: t.audio, dur: t.dur });
    try { await apiPost('/api/ext/add', body, ''); } catch (e) {}
  }
  if (ids.length) { toast('Избранное перенесено в «Мою музыку»'); loadLib(); }
}

/* Jamendo */
async function jam(extra) {
  const base = 'https://api.jamendo.com/v3.0/tracks/?client_id=' + CLIENT_ID + '&format=json&limit=40&imagesize=200&audioformat=mp32';
  const j = await (await fetch(base + extra)).json();
  return (j.results || []).filter(t => t.audio).map(slim);
}
async function search(q) {
  const my = ++reqId;
  if (!q) { results = []; render(); return; }
  if (tab === 'search') $('list').innerHTML = '<div class="msg">Ищу…</div>';
  try {
    const r = await jam('&search=' + encodeURIComponent(q));
    if (my !== reqId) return;
    results = r;
  } catch (e) {
    if (my !== reqId) return;
    results = [];
    if (tab === 'search') $('list').innerHTML = '<div class="msg">Не получилось загрузить. Проверьте интернет и попробуйте ещё раз.</div>';
    return;
  }
  render('Ничего не нашлось. Попробуйте другое название.');
}
async function loadPopular() {

/* Библиотека (ваши mp3) */
async function loadLib() {
  if (!D) { libState = 'noauth'; render(); return; }
  libState = 'loading'; render();
  try {
    const r = await fetch(API + '/api/tracks?d=' + D);
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    lib = j.tracks.map(t => t.ext
      ? { id: 'L' + t.id, rid: t.id, name: t.title, artist: t.artist || UNK, lib: true, ext: true, dur: t.dur, image: t.image || '', audio: t.audio }
      : {
        id: 'L' + t.id, rid: t.id, name: t.title, artist: t.artist || UNK, lib: true, dur: t.dur,
        image: t.cover ? API + '/api/cover/' + encodeURIComponent(t.id) + '?d=' + D : '',
        audio: API + '/api/audio/' + encodeURIComponent(t.id) + '?d=' + D
      });
    libState = 'ok';
  } catch (e) { libState = 'error'; }
  render();
  if (libState === 'ok') migrateFavs();
}
async function delTrack(t) {
  const q = 'Удалить «' + t.name + '» из библиотеки?';
  const ok = await new Promise(r => { try { tg.showConfirm(q, r); } catch (e) { r(confirm(q)); } });
  if (!ok) return;
  try { await fetch(API + '/api/delete?id=' + encodeURIComponent(t.rid) + '&d=' + D, { method: 'POST' }); } catch (e) {}
  lib = lib.filter(x => x.id !== t.id);
  render();
}

async function apiPost(path, body, q) {

function cropSquare(file, size) {
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b => res(b), 'image/jpeg', 0.85);
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

/* Плеер */
function shuf(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function buildOrder() { order = shuf(queue.filter(t => !played.has(t))); }
function play(list, i) {
  queue = list.slice(); idx = i; hist = []; upNext = []; errs = 0;
  played = new Set([queue[i]]); order = [];
  if (shuffle) buildOrder();
  load();
}
let failed = null;
function load() {
  const t = queue[idx]; if (!t) return;
  played.add(t); failed = null;
  audio.pause();
  audio.muted = true;
  audio.src = t.audio; audio.loop = repeat;
  audio.play().catch(() => {});
  $('mini').classList.add('show');
  $('seek').value = 0; $('mseek').value = 0; $('cur').textContent = '0:00';
  show(); render();
}
function show() {
  const t = queue[idx]; if (!t) return;
  const img = t.image || NOCOVER;
  $('mc').src = img; $('fc').src = img;
  $('mt').textContent = $('ft').textContent = t.name;
  $('ma').textContent = $('fa').textContent = t.artist;
  $('edit').style.display = t.lib ? '' : 'none';
  $('dur').textContent = fmt(t.dur);
  if ('mediaSession' in navigator) {
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: t.artist, artwork: t.image ? [{ src: t.image, sizes: '300x300', type: 'image/jpeg' }] : [{ src: SITE_ICON, sizes: '192x192', type: 'image/png' }] }); } catch (e) {}
  }
}
function next() {
  if (!queue.length) return;
  let t;
  if (upNext.length) t = upNext.shift();
  else if (shuffle && queue.length > 1) {
    if (!order.length) buildOrder();
    t = order.pop();
    if (!t) { audio.pause(); toast('Все песни сыграны. Выберите песню или нажмите «Перемешать»'); return; }
  } else t = queue[(idx + 1) % queue.length];
  hist.push(queue[idx]); if (hist.length > 50) hist.shift();
  if (!queue.includes(t)) queue.splice(idx + 1, 0, t);
  idx = queue.indexOf(t);
  load();
}
function prev() {
  if (!queue.length) return;
  if (audio.currentTime > 5) { audio.currentTime = 0; return; }
  const t = hist.pop();
  idx = t && queue.includes(t) ? queue.indexOf(t) : (idx - 1 + queue.length) % queue.length;
  load();
}
function retryCurrent() {
  const t = queue[idx]; if (!t) return;
  const pos = failed ? failed.pos : 0; failed = null;
  audio.muted = true;
  audio.src = t.audio;
  audio.addEventListener('loadedmetadata', () => { if (pos > 1) audio.currentTime = pos; }, { once: true });
  audio.play().catch(() => {});
}
function toggle() {
  if (!audio.src) return;
  if (failed) { retryCurrent(); return; }
  if (audio.paused) { audio.muted = false; audio.play().catch(() => {}); } else audio.pause();
}
window.addEventListener('online', () => { if (failed && failed.t === queue[idx]) retryCurrent(); });
function setIcon(p) {
  const d = p ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('ppi').innerHTML = d; $('fppi').innerHTML = d;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = p ? 'playing' : 'paused';
}
$('pp').onclick = e => { e.stopPropagation(); toggle(); };
$('mnext').onclick = e => { e.stopPropagation(); next(); };
$('mprev').onclick = e => { e.stopPropagation(); prev(); };
$('fpp').onclick = toggle;
$('next').onclick = next;
$('prev').onclick = prev;
$('sh').onclick = () => setShuffle(!shuffle);
$('rp').onclick = () => { repeat = !repeat; audio.loop = repeat; $('rp').classList.toggle('on', repeat); saveModes(); };
$('mini').onclick = e => { if (!e.target.closest('button,input')) $('full').classList.add('open'); };
$('close').onclick = () => $('full').classList.remove('open');
audio.onplay = () => setIcon(true);
audio.onpause = () => setIcon(false);
audio.onplaying = () => { setTimeout(() => { audio.muted = false; }, 90); };
audio.onended = () => next();
audio.onerror = () => {
  audio.muted = false;
  if (!queue[idx]) return;
  setIcon(false);
  failed = { t: queue[idx], pos: audio.currentTime || 0 };
  toast(navigator.onLine ? 'Не удалось загрузить песню. Нажмите ▶, чтобы повторить.' : 'Нет соединения. Песня продолжится, когда связь вернётся.');
};
audio.ontimeupdate = () => {
  if (!audio.duration || seeking) return;
  const p = audio.currentTime / audio.duration * 100;
  $('seek').value = p; $('mseek').value = p;
  $('cur').textContent = fmt(audio.currentTime); $('dur').textContent = fmt(audio.duration);
  if ('mediaSession' in navigator) { try { navigator.mediaSession.setPositionState({ duration: audio.duration, position: audio.currentTime, playbackRate: 1 }); } catch (e) {} }
};
['seek', 'mseek'].forEach(id => {
  const el = $(id);
  el.oninput = () => { seeking = true; $('seek').value = $('mseek').value = el.value; if (audio.duration) $('cur').textContent = fmt(el.value / 100 * audio.duration); };
  el.onchange = () => { if (audio.duration) audio.currentTime = el.value / 100 * audio.duration; seeking = false; };
});
if ('mediaSession' in navigator) {
  const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  h('play', () => audio.play()); h('pause', () => audio.pause());
  h('previoustrack', prev); h('nexttrack', next);
  h('seekto', d => { if (d.seekTime != null) audio.currentTime = d.seekTime; });
}

/* Правка названия и исполнителя */
$('edit').onclick = () => {
  const t = queue[idx]; if (!t) return;
  $('et').value = t.name; $('ea').value = t.artist === UNK ? '' : t.artist;
  $('dlg').classList.add('show');
};
$('ecancel').onclick = () => $('dlg').classList.remove('show');
$('esave').onclick = async () => {
  const t = queue[idx]; if (!t) return;
  const n = $('et').value.trim() || t.name, a = $('ea').value.trim();
  t.name = n; t.artist = a || UNK;
  $('dlg').classList.remove('show');
  show(); render();
  try { await fetch(API + '/api/edit?id=' + encodeURIComponent(t.rid) + '&t=' + encodeURIComponent(n) + '&a=' + encodeURIComponent(a) + '&d=' + D, { method: 'POST' }); } catch (e) {}
};

/* Меню, разделы, тема */
const TITLES = { lib: 'Моя музыка', playlists: 'Плейлисты', search: 'Поиск', settings: 'Настройки' };
const PH = { lib: 'Поиск по библиотеке', search: 'Трек или исполнитель' };
function go(v, id) {
  tab = v;
  if (v === 'pl') curPl = id;
  const p = v === 'pl' ? curPlObj() : null;
  $('title').textContent = p ? p.name : TITLES[v];
  const act = v === 'pl' ? 'playlists' : v;
  document.querySelectorAll('.di').forEach(b => b.classList.toggle('on', b.dataset.go === act));
  $('q').style.display = PH[v] ? '' : 'none';
  if (PH[v]) $('q').placeholder = PH[v];
  $('q').value = '';
  closeDrawer();
  if (v === 'lib') loadLib();
  else if ((v === 'playlists' || v === 'pl') && libState !== 'ok' && libState !== 'loading') loadLib();
  if (v === 'playlists' && plState !== 'ok' && plState !== 'loading') loadPlaylists();
  if (v === 'search' && !popular.length) loadPopular();
  render();
  $('list').scrollTop = 0;
}
function openDrawer() { $('drawer').classList.add('open'); $('scrim').classList.add('show'); }
function closeDrawer() { $('drawer').classList.remove('open'); $('scrim').classList.remove('show'); }
$('menu').onclick = openDrawer;
$('scrim').onclick = closeDrawer;
document.querySelectorAll('.di').forEach(b => { b.onclick = () => go(b.dataset.go); });

let sx = 0, sy = 0, sOk = false;
document.addEventListener('touchstart', e => {
  const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
  sOk = !e.target.closest('input,#dlg,#pld,#sov');
}, { passive: true });
document.addEventListener('touchend', e => {
  if (!sOk) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6) return;
  const open = $('drawer').classList.contains('open');
  if (dx > 0 && !open && !$('full').classList.contains('open')) openDrawer();
  else if (dx < 0 && open) closeDrawer();
}, { passive: true });

/* Обновление свайпом вниз */
let pull = null, refreshing = false;
function setPull(px) {
  const el = $('ptr');
  el.style.opacity = px ? Math.min(px / 60, 1) : 0;
  el.style.transform = 'translate(-50%, ' + (px - 50) + 'px) rotate(' + px * 3 + 'deg)';
}
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  const el = $('ptr');
  el.classList.add('spin'); el.style.opacity = 1; el.style.transform = 'translate(-50%, 56px)';
  try {
    if (tab === 'playlists') await loadPlaylists();
    else if (tab === 'pl') { await loadLib(); await loadPlaylists(); }
    else if (tab === 'search') { const q = $('q').value.trim(); if (q) await search(q); else await loadPopular(); }
    else await loadLib();
  } catch (e) {}
  el.classList.remove('spin'); setPull(0); refreshing = false;
  toast('Обновлено');
}
document.addEventListener('touchstart', e => {
  pull = null;
  if (e.touches.length !== 1 || refreshing || $('list').scrollTop > 0) return;
  if (e.target.closest('input,#full,#drawer,#scrim,#sov,#dlg,#pld,#login,#mini')) return;
  pull = { y: e.touches[0].clientY, x: e.touches[0].clientX, d: 0 };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!pull) return;
  const dy = e.touches[0].clientY - pull.y, dx = Math.abs(e.touches[0].clientX - pull.x);
  if (dy <= 0 || dx > dy * 0.8) { pull.d = 0; setPull(0); return; }
  pull.d = dy; setPull(Math.min(dy * 0.6, 80));
}, { passive: true });
document.addEventListener('touchend', () => {
  if (pull && pull.d > 110) refresh(); else setPull(0);
  pull = null;
}, { passive: true });

const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const uname = u ? [u.first_name, u.last_name].filter(Boolean).join(' ') : (lsGet('uname') || 'Гость');
$('dname').textContent = uname;
$('duser').textContent = u && u.username ? '@' + u.username : '';
if (u && u.photo_url) $('av').innerHTML = '<img alt="" src="' + esc(u.photo_url) + '">';
else $('av').textContent = uname.charAt(0).toUpperCase();

function setTheme(v) {
  applyTheme(v);
  try { localStorage.setItem('theme', theme); } catch (e) {}
  sSet('theme', theme);
  render();
}
function renderSettings() {
  const b = (v, l) => '<button data-tm="' + v + '" class="' + (theme === v ? 'on' : '') + '">' + l + '</button>';
  $('list').innerHTML = '<div class="set">' +
    '<div class="sh">Тема</div><div class="seg">' + b('light', 'Светлая') + b('dark', 'Тёмная') + '</div>' +
    '<div class="sh">Как добавить песни</div><p class="hint">Перешлите mp3-файлы боту в личные сообщения. Они появятся в «Моя музыка» примерно через минуту.</p>' +
    (!inTg && lsGet('tok') ? '<div class="sh">Аккаунт</div><p class="hint" style="margin-bottom:10px">Вы вошли как ' + esc(lsGet('uname') || 'пользователь Telegram') + '</p><button class="btn" data-act="logout">Выйти</button>' : '') +
    '<div class="sh">Об источниках</div><p class="hint">«Поиск» работает на музыке Jamendo со свободными лицензиями. Понравившиеся песни сохраняются в «Моей музыке».</p>' +
    '</div>';
}

let timer;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  if (tab === 'lib') { render(); return; }
  $('qhint').classList.toggle('show', tab === 'search' && !$('q').value.trim());
  timer = setTimeout(() => search($('q').value.trim()), 450);
});
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(timer); if (tab === 'search') search($('q').value.trim()); $('q').blur(); }
});

sGet('theme').then(v => { if (v && v !== theme) { applyTheme(v); render(); } });
/* Вход через Telegram (вне Telegram) */
async function logout() {
  if (!(await ask('Выйти из аккаунта на этом устройстве?'))) return;
  try { await fetch(API + '/auth/logout?d=' + encodeURIComponent(lsGet('tok') || ''), { method: 'POST' }); } catch (e) {}
  lsDel('tok'); lsDel('uname'); location.reload();
}
let polling = false;
async function checkLogin(code) {
  try {
    const c = await (await fetch(API + '/auth/check?code=' + encodeURIComponent(code))).json();
    if (c.token) { lsSet('tok', c.token); lsSet('uname', c.name || ''); lsDel('lcode'); location.reload(); return 'done'; }
    if (c.expired) { lsDel('lcode'); return 'expired'; }
  } catch (e) {}
  return 'wait';
}
async function pollLogin(code) {
  if (polling) return;
  polling = true;
  $('lstatus').textContent = 'Жду подтверждения в Telegram. После нажатия кнопки это может занять до минуты.';
  $('lcheck').style.display = '';
  for (let i = 0; i < 400; i++) {
    const r = await checkLogin(code);
    if (r === 'done') return;
    if (r === 'expired') break;
    await new Promise(res => setTimeout(res, 2000));
  }
  polling = false;
  $('lcheck').style.display = 'none';
  $('lstatus').textContent = 'Время вышло. Нажмите «Войти через Telegram» ещё раз.';
}
async function startLogin() {
  const st = $('lstatus');
  st.textContent = 'Создаю ссылку для входа…';
  let j;
  try { j = await (await fetch(API + '/auth/start', { method: 'POST' })).json(); }
  catch (e) { st.textContent = 'Нет связи с сервером. Проверьте интернет.'; return; }
  if (!j.bot) { st.textContent = 'Сервер не смог создать ссылку. Попробуйте позже.'; return; }
  const link = 'https://t.me/' + j.bot + '?start=login_' + j.code;
  lsSet('lcode', j.code);
  $('llink').href = link; $('llink').style.display = 'block';
  window.open(link, '_blank');
  pollLogin(j.code);
}
$('lbtn').onclick = startLogin;
$('lcheck').onclick = async () => {
  const c = lsGet('lcode'); if (!c) return;
  $('lstatus').textContent = 'Проверяю…';
  const r = await checkLogin(c);
  if (r === 'wait') $('lstatus').textContent = 'Подтверждение ещё не дошло. Подождите немного и нажмите снова.';
  if (r === 'expired') $('lstatus').textContent = 'Время вышло. Нажмите «Войти через Telegram» ещё раз.';
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden || D) return;
  const c = lsGet('lcode'); if (!c) return;
  checkLogin(c); pollLogin(c);
});
if (!D) {
  $('login').classList.add('show');
  const pending = lsGet('lcode');
  if (pending) pollLogin(pending);
}
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

restoreModes(lsGet('modes'));
sGet('modes').then(v => { if (v) restoreModes(v); });
go('lib');
loadPlaylists();
</script>
</body>
</html>
